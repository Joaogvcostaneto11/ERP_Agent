<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bill Ingestion</title>
  <link rel="stylesheet" href="/bills.css" />
</head>
<body>
  <header>
    <h1>Bill Ingestion</h1>
    <label>Operator <input id="operator" placeholder="your name" /></label>
  </header>
  <main>
    <section id="upload-zone">
      <input type="file" id="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/gif" />
      <button id="upload-btn">Upload &amp; extract</button>
      <span id="status"></span>
    </section>
    <form id="review" hidden></form>
  </main>
  <script src="/app.js"></script>
  <section id="admin-panel" hidden class="admin">
    <h2>Write mapping <span id="admin-version"></span></h2>
    <label>Admin token <input id="admin-token" type="password" autocomplete="off"></label>
    <div id="admin-body" hidden>
      <textarea id="admin-prose" rows="3"
        placeholder="e.g. the supplier's own article code belongs in LinDoc001.CodigoForn"></textarea>
      <div class="admin-actions">
        <button id="admin-draft">Draft change</button>
        <button id="admin-apply" hidden>Apply</button>
      </div>
      <pre id="admin-output"></pre>
      <div id="admin-history" class="admin-history"></div>
    </div>
  </section>
  <script type="module" src="./admin.js"></script>
</body>
</html>
