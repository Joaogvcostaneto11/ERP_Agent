<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Agent — Payroll</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .03em; }
    header span { font-size: .75rem; opacity: .55; }

    .role-bar {
      background: #16213e;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .role-bar label { color: #aaa; font-size: .75rem; }
    .role-bar select {
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: .8rem;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bubble-wrap { display: flex; flex-direction: column; }
    .bubble-wrap.right { align-items: flex-end; }

    .msg {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: .9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .msg.error {
      background: #fff0f0;
      color: #c0392b;
      border-left: 3px solid #e74c3c;
    }

    /* Success card shown after an action completes */
    .action-card {
      max-width: 72%;
      background: #f0faf4;
      border: 1px solid #a8d5b8;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: .85rem;
      color: #1a5c34;
    }
    .action-card .card-title {
      font-weight: 700;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #27ae60;
      margin-bottom: 8px;
    }
    .action-card table { border-collapse: collapse; width: 100%; }
    .action-card td { padding: 3px 0; }
    .action-card td:first-child { color: #555; padding-right: 16px; font-size: .8rem; }

    .meta { font-size: .7rem; color: #aaa; margin-top: 4px; }

    .spinner {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 14px 18px;
    }
    .spinner span {
      width: 7px; height: 7px;
      background: #bbb;
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .spinner span:nth-child(2) { animation-delay: .15s; }
    .spinner span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    .input-bar {
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    #userInput {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .9rem;
      outline: none;
      resize: none;
      height: 44px;
      line-height: 1.4;
      transition: border-color .2s;
    }
    #userInput:focus { border-color: #1a1a2e; }

    button {
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }

    #sendBtn { background: #1a1a2e; color: #fff; height: 44px; }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }

    #voiceBtn {
      background: #f0f0f0; color: #333;
      height: 44px; width: 44px; padding: 0; font-size: 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>ERP Agent &mdash; Payroll</h1>
  <span>AI-native · business logic layer</span>
</header>

<div class="role-bar">
  <label>Acting as</label>
  <select id="roleSelect">
    <option value="hr_manager">HR Manager</option>
    <option value="finance_director">Finance Director</option>
    <option value="employee">Employee</option>
    <option value="auditor">Auditor</option>
  </select>
</div>

<div id="chat">
  <div class="bubble-wrap">
    <div class="msg agent">
      Hello! I'm your AI-powered payroll assistant.<br><br>
      You can ask me things like:<br>
      &bull; <em>"Create new employee"</em><br>
      &bull; <em>"Run payroll for May 2026"</em><br>
      &bull; <em>"Approve the pending payroll run"</em><br>
      &bull; <em>"Show me the payslip for employee E001"</em>
    </div>
  </div>
</div>

<div class="input-bar">
  <button id="voiceBtn" title="Voice input (coming soon)">🎙</button>
  <textarea id="userInput" placeholder="Type a payroll request…" rows="1"></textarea>
  <button id="sendBtn">Send</button>
</div>

<script>
  const chat       = document.getElementById('chat');
  const input      = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const roleSelect = document.getElementById('roleSelect');

  let sessionId = null;

  input.addEventListener('input', () => {
    input.style.height = '44px';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  function addBubble(text, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap' + (cls === 'user' ? ' right' : '');
    const msg = document.createElement('div');
    msg.className = `msg ${cls}`;
    msg.textContent = text;
    wrap.appendChild(msg);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function addActionCard(action) {
    if (!action || !action.result) return;
    const { tool, input: inp, result } = action;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const card = document.createElement('div');
    card.className = 'action-card';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = tool === 'create_employee' ? 'Employee Created' : tool;
    card.appendChild(title);

    // Build a table of the saved values
    const table = document.createElement('table');
    const fields = tool === 'create_employee' ? inp : result;
    for (const [k, v] of Object.entries(fields)) {
      if (v === undefined || v === null) continue;
      const row = table.insertRow();
      row.insertCell().textContent = k.replace(/_/g, ' ');
      row.insertCell().textContent = Array.isArray(v) ? v.join(', ') || '—' : v;
    }
    card.appendChild(table);
    wrap.appendChild(card);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function showSpinner() {
    const s = document.createElement('div');
    s.className = 'spinner';
    s.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(s);
    chat.scrollTop = chat.scrollHeight;
    return s;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    input.value = '';
    input.style.height = '44px';
    sendBtn.disabled = true;

    const spinner = showSpinner();

    try {
      const res = await fetch('/payroll/converse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
          user_id: 'ui-user',
          role: roleSelect.value,
        }),
      });

      spinner.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addBubble(`Error ${res.status}: ${err.detail || JSON.stringify(err)}`, 'error');
      } else {
        const data = await res.json();
        sessionId = data.session_id;
        addBubble(data.reply, 'agent');
        if (data.action_taken) addActionCard(data.action_taken);
      }
    } catch (e) {
      spinner.remove();
      addBubble(`Network error: ${e.message}`, 'error');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  document.getElementById('voiceBtn').addEventListener('click', () => {
    addBubble('Voice input is not yet available. Please type your request.', 'agent');
  });
</script>
</body>
</html>
